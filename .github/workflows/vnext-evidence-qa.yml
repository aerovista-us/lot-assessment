name: LotScope vNext evidence QA

on:
  push:
    branches:
      - 'feature/vnext-*'
  pull_request:
    paths:
      - 'packages/evidence/**'
      - 'packages/audit/**'
      - 'packages/circulation/hardened.ts'
      - 'lib/evidence-adapter.ts'
      - 'lib/workbench-evidence-adapter.ts'
      - 'components/AssessmentResult.tsx'
      - 'components/assessment-result.module.css'
      - 'app/vnext/**'
      - 'app/assessment/**'
      - 'app/workbench/vnext/**'
      - 'app/workbench/assessment/**'
      - 'app/workbench/evidence/**'
      - 'app/api/assessment/**'
      - 'app/api/workbench/pondy-evidence/**'
      - 'projects/pondy-design4/**'
      - 'docs/VNEXT_SOLVE_PROVE_EXPLAIN.md'
      - 'docs/MOBILITY_AUDIT_CONTRACT.md'
      - '.github/workflows/vnext-evidence-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Evidence contract smoke checks
        run: |
          grep -q 'lotscope-assessment-evidence-v1' packages/evidence/index.ts
          grep -q 'PROFESSIONAL_REVIEW' packages/evidence/index.ts
          grep -q 'auditMotionPath' packages/circulation/hardened.ts
          grep -q 'pavementViolationSamples' packages/circulation/hardened.ts
          grep -q 'reverseReplayPass' packages/circulation/hardened.ts
          grep -q 'comfortableClearanceFt' packages/circulation/hardened.ts
          grep -q 'B-SOUTH-door' projects/pondy-design4/evidence.ts
          grep -q '0.073' projects/pondy-design4/evidence.ts
          grep -q 'mode="PUBLIC"' app/assessment/pondy-d4/page.tsx
          grep -q 'mode="WORKBENCH"' app/workbench/assessment/pondy-d4/page.tsx
          grep -q 'guidedAssessmentEvidence' app/api/assessment/guided/route.ts
          grep -q 'guidedAssessmentEvidence' app/assessment/guided/page.tsx
          grep -q 'workbenchCandidateEvidence' app/api/workbench/pondy-evidence/route.ts
          grep -q 'Run Workbench evidence' app/workbench/evidence/page.tsx
          grep -q 'PUBLIC PREVIEW' app/vnext/page.tsx
          grep -q 'PRIVATE' app/workbench/vnext/page.tsx
