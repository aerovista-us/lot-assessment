name: Workbench Identity QA

on:
  pull_request:
    paths:
      - 'app/workbench/**'
      - 'app/workbench-auth/**'
      - 'app/api/workbench/**'
      - 'lib/aerovista/**'
      - 'scripts/test-workbench-handoff-failure.mjs'
      - 'scripts/test-candidate-customer-report.mjs'
      - 'packages/candidates/customer-report.ts'
      - 'packages/candidates/customer-report-views.ts'
      - 'packages/candidates/design-document.ts'
      - 'packages/candidates/design-report-attachment.ts'
      - 'packages/candidates/workspace.ts'
      - 'packages/candidates/index.ts'
      - 'components/workbench/UniversalDesignEditor.tsx'
      - 'components/workbench/useCandidateWorkspace.ts'
      - 'scripts/test-universal-design-document.mjs'
      - 'packages/candidates/customer-report-roof-gallery.ts'
      - 'scripts/test-customer-report-roof-gallery.mjs'
      - 'components/workbench/CandidateWorkspaceClient.tsx'
      - 'components/workbench/CandidateLibraryWorkspace.tsx'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/workbench-identity-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.AEROVISTA_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@aerovista-us'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Verify classified broker and founder access failures
        run: node --experimental-loader ./scripts/alias-loader.mjs scripts/test-workbench-handoff-failure.mjs
      - name: Protected roof inspector React source and valley review acceptance
        run: npm run test:roof-inspector
      - name: Candidate report geometry, 22-feature coverage and roof authority fail-closed
        run: node --experimental-loader ./scripts/alias-loader.mjs scripts/test-candidate-customer-report.mjs
      - name: Roof gallery all-owner projection evidence and fail-closed acceptance
        run: node --experimental-loader ./scripts/alias-loader.mjs scripts/test-customer-report-roof-gallery.mjs
      - name: Universal owner-bound floor and roof draft document acceptance
        run: npm run test:universal-design
      - name: Production build
        run: npm run build
      - name: Anonymous boundary smoke
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lotscope-identity.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q 'GUIDED ASSESSMENT'
          curl -fsS http://127.0.0.1:3000/assessment/guided >/dev/null
          curl -fsS http://127.0.0.1:3000/workbench-auth | grep -q 'AeroVista sign in required'
          test "$(curl -sS -o /tmp/workbench.html -w '%{http_code}' http://127.0.0.1:3000/workbench)" = "307"
          grep -qi '/workbench-auth' <(curl -sSI http://127.0.0.1:3000/workbench)
          test "$(curl -sS -o /tmp/registry.json -w '%{http_code}' http://127.0.0.1:3000/api/workbench/registry)" = "401"
          grep -q 'workbench_not_authorized' /tmp/registry.json
          curl -fsS http://127.0.0.1:3000/api/workbench/auth/session | grep -q '"authenticated":false'
