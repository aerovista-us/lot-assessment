name: Pondy solver benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'packages/**'
      - 'projects/pondy-lot2/**'
      - '.github/workflows/pondy-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'projects/pondy-lot2/**'
      - 'app/api/workbench/pondy/**'
      - 'app/api/workbench/pondy-ranked/**'
      - 'app/api/workbench/pondy-report/**'
      - '.github/workflows/pondy-benchmark.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start local LotScope
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lotscope.log 2>&1 &
          echo $! > /tmp/lotscope.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lotscope.log
          exit 1

      - name: Run physical benchmark
        run: curl --fail --show-error --silent http://127.0.0.1:3000/api/workbench/pondy > pondy-physical.json

      - name: Run ranked physical + program benchmark
        run: curl --fail --show-error --silent http://127.0.0.1:3000/api/workbench/pondy-ranked > pondy-ranked.json

      - name: Generate visual comparison report
        run: curl --fail --show-error --silent http://127.0.0.1:3000/api/workbench/pondy-report > pondy-report.html

      - name: Build auditable manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const physical = JSON.parse(fs.readFileSync('pondy-physical.json','utf8'));
          const ranked = JSON.parse(fs.readFileSync('pondy-ranked.json','utf8'));
          const project = fs.readFileSync('projects/pondy-lot2/project.json','utf8');
          const manifest = {
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            eventName: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            projectSpecSha256: crypto.createHash('sha256').update(project).digest('hex'),
            solver: ranked.solver || physical.solver || null,
            physicalCount: physical.count ?? physical.results?.length ?? 0,
            physicalPassCount: physical.passCount ?? 0,
            combinedPassCount: ranked.combinedPassCount ?? 0,
            families: ranked.families || physical.families || [],
            shortlist: (ranked.shortlist || []).slice(0, 10).map(x => ({
              id: x.id,
              family: x.family,
              physicalPass: x.physicalPass,
              programPass: x.programPass,
              combinedPass: x.combinedPass,
              combinedScore: x.combinedScore,
              minimumClearanceFt: x.minimumClearanceFt
            }))
          };
          fs.writeFileSync('pondy-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Print compact result
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['pondy-physical.json','pondy-ranked.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`\n${file}`);
            console.log(JSON.stringify({
              solver: data.solver,
              elapsedMs: data.elapsedMs,
              count: data.count,
              passCount: data.passCount,
              combinedPassCount: data.combinedPassCount,
              families: data.families,
              top: (data.shortlist || data.results || []).slice(0, 5).map(x => ({
                id: x.id,
                family: x.family,
                pass: x.pass,
                physicalPass: x.physicalPass,
                programPass: x.programPass,
                combinedPass: x.combinedPass,
                combinedScore: x.combinedScore,
                minimumClearanceFt: x.minimumClearanceFt,
                issues: x.issues || x.physicalIssues
              }))
            }, null, 2));
          }
          NODE

      - name: Publish Actions summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const physical = JSON.parse(fs.readFileSync('pondy-physical.json','utf8'));
          const ranked = JSON.parse(fs.readFileSync('pondy-ranked.json','utf8'));
          const shortlist = ranked.shortlist || [];
          console.log('# Pondy solver benchmark');
          console.log(`- Physical retained: **${physical.count ?? physical.results?.length ?? 0}**`);
          console.log(`- Physical passes: **${physical.passCount ?? 0}**`);
          console.log(`- Combined physical + program passes: **${ranked.combinedPassCount ?? 0}**`);
          console.log(`- Diverse promoted shortlist: **${shortlist.length}**`);
          console.log('');
          console.log('| Candidate | Family | Physical | Program | Clearance | Score |');
          console.log('|---|---|---:|---:|---:|---:|');
          for (const x of shortlist.slice(0,5)) {
            console.log(`| ${x.id} | ${x.family} | ${x.physicalPass ? 'PASS' : 'FAIL'} | ${x.programPass ? 'PASS' : 'FAIL'} | ${x.minimumClearanceFt == null ? 'n/a' : x.minimumClearanceFt.toFixed(2) + ' ft'} | ${Number(x.combinedScore ?? 0).toFixed(1)} |`);
          }
          NODE

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pondy-benchmark-${{ github.sha }}
          path: |
            pondy-manifest.json
            pondy-physical.json
            pondy-ranked.json
            pondy-report.html
          retention-days: 90

      - name: Persist benchmark to results branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pondy-results
          git worktree add --detach /tmp/pondy-results HEAD
          cd /tmp/pondy-results
          if git ls-remote --exit-code --heads origin benchmark-results >/dev/null 2>&1; then
            git fetch origin benchmark-results
            git switch -C benchmark-results origin/benchmark-results
          else
            git switch --orphan benchmark-results
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "runs/${GITHUB_SHA}"
          cp "$GITHUB_WORKSPACE/pondy-manifest.json" "runs/${GITHUB_SHA}/manifest.json"
          cp "$GITHUB_WORKSPACE/pondy-physical.json" "runs/${GITHUB_SHA}/physical.json"
          cp "$GITHUB_WORKSPACE/pondy-ranked.json" "runs/${GITHUB_SHA}/ranked.json"
          cp "$GITHUB_WORKSPACE/pondy-report.html" "runs/${GITHUB_SHA}/report.html"
          cp "$GITHUB_WORKSPACE/pondy-manifest.json" latest.json
          printf '# Pondy benchmark results\n\nGenerated by `.github/workflows/pondy-benchmark.yml`. Each main-branch solver run is preserved under `runs/<commit-sha>/`. `latest.json` points at the newest preserved run.\n' > README.md
          git add README.md latest.json runs/
          git commit -m "Persist Pondy benchmark ${GITHUB_SHA}" || exit 0
          git push origin HEAD:benchmark-results

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lotscope.pid ]; then kill "$(cat /tmp/lotscope.pid)" || true; fi
