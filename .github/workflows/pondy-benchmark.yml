name: Pondy solver benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'packages/**'
      - 'projects/pondy-lot2/**'
      - '.github/workflows/pondy-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'projects/pondy-lot2/**'
      - 'app/api/workbench/pondy-ranked/**'
      - '.github/workflows/pondy-benchmark.yml'

concurrency:
  group: pondy-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start local LotScope
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/lotscope.log 2>&1 &
          echo $! > /tmp/lotscope.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lotscope.log
          exit 1

      - name: Run authoritative Pondy benchmark
        run: curl --fail --show-error --silent http://127.0.0.1:3000/api/workbench/pondy-ranked > pondy-ranked.json

      - name: Derive physical view and comparison report
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ranked = JSON.parse(fs.readFileSync('pondy-ranked.json','utf8'));
          const physical = {
            project: ranked.project,
            scenario: ranked.scenario,
            solver: ranked.solver,
            searchMode: ranked.searchMode,
            count: ranked.evaluatedCount,
            passCount: ranked.physicalPassCount,
            families: ranked.families,
            results: (ranked.results || []).map(x => ({
              id: x.id,
              family: x.family,
              pass: x.physicalPass,
              objective: x.physicalObjective,
              repaired: x.repaired,
              minimumClearanceFt: x.minimumClearanceFt,
              issues: x.physicalIssues,
              placements: x.placements,
              drives: x.drives,
              variables: x.variables,
              metadata: x.metadata
            }))
          };
          fs.writeFileSync('pondy-physical.json', JSON.stringify(physical, null, 2) + '\n');

          const survey = [[0,0],[148,0],[148,50],[125.143,43.016],[84.813,43.016],[0,57.01]];
          const points = survey.map(([x,y]) => `${x},${y}`).join(' ');
          const cards = (ranked.shortlist?.length ? ranked.shortlist : ranked.results || []).slice(0,5);
          const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const svg = x => `<svg viewBox="-8 -8 170 76"><polygon points="${points}" fill="#fafafa" stroke="#222" stroke-width=".7"/>${(x.drives||[]).map(d=>`<polyline points="${d.points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#777" stroke-width="2.5"/>`).join('')}${(x.placements||[]).map(p=>`<rect x="${p.x}" y="${p.y}" width="${p.widthFt}" height="${p.depthFt}" fill="${p.kind==='garage'?'#d9e9d5':'#ddd'}" stroke="#333" stroke-width=".5"/>`).join('')}</svg>`;
          const html = `<!doctype html><html><head><meta charset="utf-8"><title>Pondy discovery comparison</title><style>body{font:14px system-ui,sans-serif;margin:24px;background:#f5f5f2;color:#171717}h1{margin-bottom:4px}.meta{color:#666;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pass{color:#18753c}.warn{color:#9a6400}svg{width:100%;height:auto;background:#fff;border-radius:8px}.small{font-size:12px;color:#555}</style></head><body><h1>Pondy Lot 2 · baseline discovery comparison</h1><div class="meta">${esc(ranked.solver)} · ${ranked.combinedPassCount} combined pass · ${ranked.promotionReadyCount ?? 0} promotion ready · ${ranked.families.length} families</div><div class="grid">${cards.map(x=>`<article class="card"><div class="row"><div><strong>${esc(x.id)}</strong><div>${esc(x.family)}</div></div><strong class="${x.promotionReady?'pass':'warn'}">${x.promotionReady?'PROMOTION READY':x.combinedPass?'TECHNICAL PASS':'NOT PROMOTED'}</strong></div>${svg(x)}<div class="row"><span>physical ${x.physicalPass?'PASS':'FAIL'}</span><span>program ${x.programPass?'PASS':'FAIL'}</span><span>clearance ${x.minimumClearanceFt==null?'n/a':Number(x.minimumClearanceFt).toFixed(2)+' ft'}</span><span>score ${Number(x.combinedScore||0).toFixed(1)}</span></div><div class="small">buildable-land pavement ${x.pavement?.estimatedBuildablePavementSqFt==null?'n/a':Number(x.pavement.estimatedBuildablePavementSqFt).toFixed(0)+' SF'} · capacity ready ${x.promotionChecks?.capacityReady?'yes':'no'}</div></article>`).join('')}</div><p class="small">Promotion-ready is stricter than technical PASS: current benchmark requires ≥${ranked.promotionClearanceFt ?? 1} ft internal vehicle clearance and no under-8% living-capacity margin. Pavement figures are ranking estimates, not civil takeoffs.</p></body></html>`;
          fs.writeFileSync('pondy-report.html', html);
          NODE

      - name: Build auditable manifest
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const physical = JSON.parse(fs.readFileSync('pondy-physical.json','utf8'));
          const ranked = JSON.parse(fs.readFileSync('pondy-ranked.json','utf8'));
          const project = fs.readFileSync('projects/pondy-lot2/project.json','utf8');
          const manifest = {
            schemaVersion: 2,
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            eventName: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            projectSpecSha256: crypto.createHash('sha256').update(project).digest('hex'),
            solver: ranked.solver,
            scoringVersion: ranked.scoringVersion,
            scenario: ranked.scenario,
            physicalCount: physical.count,
            physicalPassCount: physical.passCount,
            combinedPassCount: ranked.combinedPassCount ?? 0,
            promotionReadyCount: ranked.promotionReadyCount ?? 0,
            families: ranked.families || [],
            shortlist: (ranked.shortlist || []).slice(0, 10).map(x => ({
              id: x.id,
              family: x.family,
              physicalPass: x.physicalPass,
              programPass: x.programPass,
              combinedPass: x.combinedPass,
              promotionReady: x.promotionReady,
              combinedScore: x.combinedScore,
              minimumClearanceFt: x.minimumClearanceFt,
              estimatedBuildablePavementSqFt: x.pavement?.estimatedBuildablePavementSqFt ?? null
            }))
          };
          fs.writeFileSync('pondy-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Print compact result
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('pondy-ranked.json', 'utf8'));
          console.log(JSON.stringify({
            solver: data.solver,
            elapsedMs: data.elapsedMs,
            physicalPassCount: data.physicalPassCount,
            combinedPassCount: data.combinedPassCount,
            promotionReadyCount: data.promotionReadyCount,
            families: data.families,
            top: (data.shortlist || []).slice(0, 5).map(x => ({
              id: x.id,
              family: x.family,
              promotionReady: x.promotionReady,
              combinedScore: x.combinedScore,
              minimumClearanceFt: x.minimumClearanceFt,
              estimatedBuildablePavementSqFt: x.pavement?.estimatedBuildablePavementSqFt,
              capacityReady: x.promotionChecks?.capacityReady
            }))
          }, null, 2));
          NODE

      - name: Publish Actions summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const ranked = JSON.parse(fs.readFileSync('pondy-ranked.json','utf8'));
          const shortlist = ranked.shortlist || [];
          console.log('# Pondy solver benchmark');
          console.log(`- Scenario: **${ranked.scenario || 'unset'}**`);
          console.log(`- Physical passes: **${ranked.physicalPassCount ?? 0}**`);
          console.log(`- Combined physical + program passes: **${ranked.combinedPassCount ?? 0}**`);
          console.log(`- Promotion-ready candidates: **${ranked.promotionReadyCount ?? 0}**`);
          console.log(`- Diverse technical shortlist: **${shortlist.length}**`);
          console.log('');
          console.log('| Candidate | Family | Promotion | Clearance | Capacity | Buildable pavement* | Score |');
          console.log('|---|---|---:|---:|---:|---:|---:|');
          for (const x of shortlist.slice(0,5)) {
            const pavement = x.pavement?.estimatedBuildablePavementSqFt;
            console.log(`| ${x.id} | ${x.family} | ${x.promotionReady ? 'READY' : 'TECH PASS'} | ${x.minimumClearanceFt == null ? 'n/a' : x.minimumClearanceFt.toFixed(2) + ' ft'} | ${x.promotionChecks?.capacityReady ? 'READY' : 'TIGHT'} | ${pavement == null ? 'n/a' : pavement.toFixed(0) + ' sf'} | ${Number(x.combinedScore ?? 0).toFixed(1)} |`);
          }
          console.log('');
          console.log('*Estimated ranking metric, not a paving takeoff.');
          NODE

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pondy-benchmark-${{ github.sha }}
          path: |
            pondy-manifest.json
            pondy-physical.json
            pondy-ranked.json
            pondy-report.html
          retention-days: 90

      - name: Persist benchmark to results branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pondy-results
          git worktree add --detach /tmp/pondy-results HEAD
          cd /tmp/pondy-results
          if git ls-remote --exit-code --heads origin benchmark-results >/dev/null 2>&1; then
            git fetch origin benchmark-results
            git switch -C benchmark-results origin/benchmark-results
          else
            git switch --orphan benchmark-results
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "runs/${GITHUB_SHA}"
          cp "$GITHUB_WORKSPACE/pondy-manifest.json" "runs/${GITHUB_SHA}/manifest.json"
          cp "$GITHUB_WORKSPACE/pondy-physical.json" "runs/${GITHUB_SHA}/physical.json"
          cp "$GITHUB_WORKSPACE/pondy-ranked.json" "runs/${GITHUB_SHA}/ranked.json"
          cp "$GITHUB_WORKSPACE/pondy-report.html" "runs/${GITHUB_SHA}/report.html"
          cp "$GITHUB_WORKSPACE/pondy-manifest.json" latest.json
          printf '# Pondy benchmark results\n\nGenerated by `.github/workflows/pondy-benchmark.yml`. Each main-branch solver run is preserved under `runs/<commit-sha>/`. `latest.json` points at the newest preserved run.\n' > README.md
          git add README.md latest.json runs/
          git commit -m "Persist Pondy benchmark ${GITHUB_SHA}" || exit 0
          git push origin HEAD:benchmark-results

      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lotscope.pid ]; then kill "$(cat /tmp/lotscope.pid)" || true; fi