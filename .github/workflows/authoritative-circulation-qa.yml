name: Authoritative circulation engine QA

on:
  pull_request:
    paths:
      - 'packages/circulation/**'
      - 'packages/geometry/**'
      - 'packages/candidates/**'
      - 'projects/pondy-lot2/**'
      - 'scripts/test-authoritative-circulation.mjs'
      - 'scripts/run-authoritative-circulation.mjs'
      - 'package.json'
      - '.github/workflows/authoritative-circulation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Authoritative circulation semantics
        run: npm run test:authoritative-circulation
      - name: Production build
        run: npm run build
